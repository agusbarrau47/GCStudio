<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A6523"/>
      <stop offset="35%" stop-color="#A98032"/>
      <stop offset="70%" stop-color="#C9A45C"/>
      <stop offset="100%" stop-color="#825F1E"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D8BA7A"/>
      <stop offset="50%" stop-color="#B88F3D"/>
      <stop offset="100%" stop-color="#8A6523"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#8A6523" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Contenedor encuadrado de lujo (Signature Cream) -->
  <rect width="64" height="64" rx="16" fill="#FAF6F0"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldBorder)" stroke-width="1.75" stroke-opacity="0.7"/>

  <!-- Monograma GC caligráfico oficial perfectamente encuadrado -->
  <text 
    x="32" 
    y="36" 
    font-family="'Parisienne', 'Playfair Display', Georgia, 'Times New Roman', cursive, serif" 
    font-style="italic" 
    font-size="32" 
    font-weight="700" 
    text-anchor="middle" 
    fill="url(#goldText)" 
    filter="url(#softGlow)"
  >GC</text>

  <!-- Wordmark STUDIO en versalitas tracking -->
  <text 
    x="32" 
    y="49" 
    font-family="'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="7.5" 
    font-weight="800" 
    letter-spacing="2.8" 
    text-anchor="middle" 
    fill="#24190F"
  >STUDIO</text>
</svg>
